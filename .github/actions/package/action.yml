name: Package tests
description: >-
  Download intermediate test artifacts, archive them into a tarball, and delete
  the intermediates. The caller is responsible for uploading the tarball.

inputs:
  name:
    description: Tarball name (without .tar.gz) and key used in artifact filtering.
    required: true
  artifact-prefix:
    description: Prefix for intermediate artifact names.
    required: true
  source-path:
    description: Directory to download artifacts into and to include in the tarball.
    required: true
  github-token:
    description: Token used to delete intermediate artifacts.
    required: true

runs:
  using: composite
  steps:
    - name: Download intermediate artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: ${{ inputs.artifact-prefix }}-${{ inputs.name }}-*
        path: ${{ inputs.source-path }}
        merge-multiple: true

    - name: Archive tests
      shell: bash
      env:
        SOURCE_PATH: ${{ inputs.source-path }}
        ARCHIVE_NAME: ${{ inputs.name }}
      run: |
        # Ensure source-path exists so tar succeeds even when zero artifacts
        # were downloaded (e.g. presets with no per-fork reftests).
        mkdir -p "$SOURCE_PATH"
        tar --sort=name \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --mtime='@0' \
            --format=gnu \
            --use-compress-program='gzip --no-name' \
            --create \
            --file="${ARCHIVE_NAME}.tar.gz" \
            "$SOURCE_PATH"

    - name: Delete intermediate artifacts
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        ARTIFACT_NAME: ${{ inputs.name }}
      run: |
        PREFIX="${ARTIFACT_PREFIX}-${ARTIFACT_NAME}-"
        gh api "repos/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
          --paginate \
          --jq --arg p "$PREFIX" '.artifacts[] | select(.name | startswith($p)) | .id' \
          | while read -r id; do
              gh api -X DELETE "repos/${GH_REPO}/actions/artifacts/$id"
            done
